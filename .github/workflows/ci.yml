name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check docintel tests --select E9,F --ignore F401
      - run: EMBEDDER=hashing pytest -q

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-ml.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm
      - run: python -m docintel.download
      - run: python -m docintel.build
      - run: python -m docintel.evaluate   # fails the build if quality gates drop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: dashboard/data/results.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: docintel:ci, cache-from: type=gha, cache-to: "type=gha,mode=max"}
